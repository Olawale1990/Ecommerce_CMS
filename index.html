<div id="column1"> <p>1. WHAT IS HEAVEN?  2. HOW BIG IS HEAVEN? 3. WHAT  IS HEAVEN LIKE?
WHAT IS HEAVEN? Heaven is the home of the Lord God (Matthew 6:9). The Bible speaks of the three heavens(2 Corinthians 12:2). The first heaven is the area where birds fly. The second heaven is where the rockets go. The third heaven is the home or throne of the lord God. Heaven is a building of God and not man-made(2 Corinthians 5:1). It has been called the kingdom of God and of Christ (Ephesians 5:5). Surely, It is the Father's   House (John 14:2). It is a place of rest (Hebrews 4:9). </p>

<p>HOW BIG IS HEAVEN? Heaven cannot be measured (Jeremiah 31:37). Some people have erroneously considered the New Jerusalem mentioned in this lesson's Bible passage as Heaven (Revelation 21:1). Nevertheless, the New Jerusalem is not Heaven. It is a part of heaven and not Heaven itself because the  New  Jerusalem comes out "from" Heaven (Revelation 21:2,10). Though Heaven is immeasurable, still it is for the limited few who are holy and pure and the mansions there, though many, are limited. That is why the Lord has to go to prepare a place for us. Therefore, it is a very wise thing to reserve your mansion today. This you can do by surrendering totally to the Lord.</p>
